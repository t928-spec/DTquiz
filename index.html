<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>大同高中物理小考互動詳解總覽</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f8f6f1;
      --surface: #ffffff;
      --ink: #17212f;
      --muted: #667184;
      --line: #d8ddd7;
      --teal: #14736d;
      --teal-soft: #dff0ec;
      --red: #b94f43;
      --red-soft: #fae3dd;
      --gold: #a77b1d;
      --gold-soft: #f7ebce;
      --blue: #315f8b;
      --blue-soft: #dfeaf4;
      --shadow: 0 16px 36px rgba(23, 33, 47, .09);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(180deg, rgba(223, 240, 236, .82), transparent 360px),
        linear-gradient(90deg, rgba(247, 235, 206, .5), transparent 54%),
        var(--paper);
      color: var(--ink);
      font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.65;
    }

    a { color: inherit; }

    .shell {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 32px 0 56px;
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(260px, 390px);
      gap: 24px;
      align-items: end;
      min-height: 260px;
      padding: 12px 0 24px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      width: fit-content;
      margin: 0 0 14px;
      padding: 5px 9px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, .78);
      color: var(--muted);
      font-size: .9rem;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--teal);
    }

    h1 {
      margin: 0;
      max-width: 11ch;
      font-size: clamp(2.35rem, 6vw, 5.25rem);
      line-height: 1;
      letter-spacing: 0;
    }

    .subtitle {
      max-width: 68ch;
      margin: 16px 0 0;
      color: var(--muted);
      font-size: 1.04rem;
    }

    .hero-panel {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .hero-panel-text {
      display: grid;
      gap: 2px;
      padding: 10px 12px;
      border-top: 1px solid var(--line);
    }

    .hero-panel strong {
      line-height: 1.35;
    }

    .hero-panel span {
      color: var(--muted);
      font-size: .9rem;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin: 0 0 16px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, .86);
    }

    .filter-button {
      min-height: 36px;
      padding: 7px 11px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      cursor: pointer;
      font: inherit;
    }

    .filter-button:hover,
    .filter-button.active {
      border-color: var(--teal);
      background: var(--teal);
      color: #fff;
    }

    .quiz-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .quiz-card {
      display: grid;
      min-height: 100%;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: var(--shadow);
      text-decoration: none;
    }

    .quiz-card.hidden { display: none; }

    .visual {
      position: relative;
      min-height: 178px;
      background: var(--blue-soft);
      border-bottom: 1px solid var(--line);
    }

    .visual img {
      width: 100%;
      height: 100%;
      min-height: 178px;
      object-fit: cover;
      object-position: 50% 47%;
    }

    .formula-art {
      display: grid;
      place-items: center;
      min-height: 178px;
      padding: 22px;
      background:
        radial-gradient(circle at 20% 30%, rgba(20, 115, 109, .22), transparent 32%),
        linear-gradient(135deg, var(--blue-soft), var(--gold-soft));
    }

    .formula-stack {
      display: grid;
      gap: 10px;
      width: min(320px, 100%);
      color: #24374b;
      font-family: Cambria, "Times New Roman", "Noto Serif TC", serif;
      font-size: clamp(1.28rem, 3vw, 2rem);
      font-weight: 700;
    }

    .collision-art {
      display: grid;
      place-items: center;
      min-height: 178px;
      padding: 22px;
      background:
        linear-gradient(0deg, transparent 64%, rgba(23, 33, 47, .16) 65%, transparent 66%),
        linear-gradient(135deg, var(--teal-soft), var(--blue-soft));
    }

    .hero-panel .collision-art {
      min-height: 188px;
    }

    .collision-board {
      position: relative;
      width: min(340px, 100%);
      height: 120px;
    }

    .ball {
      position: absolute;
      top: 50%;
      display: grid;
      place-items: center;
      width: 54px;
      height: 54px;
      border: 3px solid var(--ink);
      border-radius: 50%;
      background: rgba(255, 255, 255, .86);
      font-weight: 900;
      transform: translateY(-50%);
    }

    .ball.left { left: 8px; }
    .ball.right { right: 8px; }

    .arrow {
      position: absolute;
      top: calc(50% - 5px);
      width: 86px;
      height: 10px;
      background: var(--teal);
    }

    .arrow::after {
      content: "";
      position: absolute;
      top: -8px;
      border-top: 13px solid transparent;
      border-bottom: 13px solid transparent;
    }

    .arrow.left {
      left: 74px;
    }

    .arrow.left::after {
      right: -1px;
      border-left: 20px solid var(--teal);
    }

    .arrow.right {
      right: 74px;
      background: var(--red);
    }

    .arrow.right::after {
      left: -1px;
      border-right: 20px solid var(--red);
    }

    .momentum-label {
      position: absolute;
      left: 50%;
      bottom: 0;
      padding: 4px 9px;
      border: 1px solid rgba(23, 33, 47, .18);
      border-radius: 999px;
      background: rgba(255, 255, 255, .72);
      color: #24374b;
      font-family: Cambria, "Times New Roman", "Noto Serif TC", serif;
      font-weight: 800;
      transform: translateX(-50%);
      white-space: nowrap;
    }

    .formula-line {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      padding: 8px 10px;
      border: 1px solid rgba(49, 95, 139, .22);
      border-radius: 8px;
      background: rgba(255, 255, 255, .66);
    }

    .card-body {
      display: grid;
      gap: 12px;
      padding: 16px;
    }

    .card-top {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: space-between;
      align-items: flex-start;
    }

    h2 {
      margin: 0;
      font-size: clamp(1.35rem, 2.4vw, 1.85rem);
      line-height: 1.2;
      letter-spacing: 0;
    }

    .date {
      display: inline-flex;
      align-items: center;
      min-height: 30px;
      padding: 4px 9px;
      border-radius: 999px;
      background: var(--teal-soft);
      color: #135d58;
      font-weight: 800;
      font-size: .9rem;
    }

    .description {
      margin: 0;
      color: var(--muted);
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 4px 8px;
      border-radius: 999px;
      background: var(--blue-soft);
      color: #244866;
      font-size: .86rem;
    }

    .card-footer {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: .92rem;
    }

    .open-label {
      color: var(--teal);
      font-weight: 900;
    }

    .note {
      margin: 18px 0 0;
      padding: 12px;
      border: 1px solid rgba(167, 123, 29, .28);
      border-radius: 8px;
      background: var(--gold-soft);
      color: #473516;
    }

    @media (max-width: 820px) {
      .hero,
      .quiz-grid {
        grid-template-columns: 1fr;
      }

      h1 {
        max-width: 12ch;
      }

      .hero-panel img {
        height: 170px;
      }
    }

    @media (max-width: 540px) {
      .shell {
        width: min(100% - 24px, 520px);
        padding-top: 18px;
      }

      .toolbar {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }

      .filter-button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="hero">
      <div>
        <p class="eyebrow"><span class="dot"></span><span>臺北市立大同高中｜物理小考詳解</span></p>
        <h1>互動詳解總覽</h1>
        <p class="subtitle">每份小考保留自己的互動詳解、易錯提醒與同學提問區。新的小考會接在這裡，根網址固定當作入口頁。</p>
      </div>
      <aside class="hero-panel">
        <div class="collision-art" aria-label="0604 碰撞守恆簡圖">
          <div class="collision-board">
            <span class="ball left">甲</span>
            <span class="arrow left"></span>
            <span class="arrow right"></span>
            <span class="ball right">乙</span>
            <span class="momentum-label">Σp 前 = Σp 後</span>
          </div>
        </div>
        <div class="hero-panel-text">
          <strong>最新：0604 碰撞守恆</strong>
          <span>範圍 4-5｜兩球與三物體彈性碰撞</span>
        </div>
      </aside>
    </header>

    <nav class="toolbar" aria-label="小考篩選">
      <button class="filter-button active" type="button" data-filter="all">全部</button>
      <button class="filter-button" type="button" data-filter="4-2to4-4">4-2 到 4-4</button>
      <button class="filter-button" type="button" data-filter="4-5">4-5</button>
    </nav>

    <main id="quizGrid" class="quiz-grid" aria-label="小考詳解列表"></main>

    <p class="note">新增小考時，把詳解檔放成 `quiz日期.html`，再在入口頁的 `quizzes` 陣列加入一筆資料即可。</p>
  </div>

  <script>
    const quizzes = [
      {
        date: "0526",
        range: "4-2to4-4",
        title: "力學能與萬有引力",
        description: "彈簧位能、簡諧運動、軌道能量、非保守力作功。",
        href: "quiz0526.html",
        topics: ["彈簧位能", "簡諧運動", "萬有引力", "非保守力"],
        meta: "5 題｜互動步驟｜留言區",
        visual: "formula"
      },
      {
        date: "0604",
        range: "4-5",
        title: "碰撞與動量守恆",
        description: "作用力與加速度、碰撞過程守恆、v-t 圖、兩球與三物體彈性碰撞。",
        href: "quiz0604.html",
        topics: ["動量守恆", "彈性碰撞", "質心速度", "速度圖"],
        meta: "5 題｜互動步驟｜小檢核｜留言區",
        visual: "collision"
      }
    ];

    const grid = document.querySelector("#quizGrid");
    const buttons = document.querySelectorAll(".filter-button");

    function render(filter = "all") {
      grid.innerHTML = quizzes.map(item => quizCard(item, filter)).join("");
    }

    function quizCard(item, filter) {
      const isHidden = filter !== "all" && item.range !== filter;
      return `
        <a class="quiz-card${isHidden ? " hidden" : ""}" href="${item.href}" data-range="${item.range}">
          <div class="visual">
            ${item.visual === "collision" ? collisionArt() : formulaArt()}
          </div>
          <div class="card-body">
            <div class="card-top">
              <h2>${item.title}</h2>
              <span class="date">${item.date}</span>
            </div>
            <p class="description">${item.description}</p>
            <div class="chips">
              ${item.topics.map(topic => `<span class="chip">${topic}</span>`).join("")}
            </div>
            <div class="card-footer">
              <span>${item.meta}</span>
              <span class="open-label">開啟詳解</span>
            </div>
          </div>
        </a>
      `;
    }

    function formulaArt() {
      return `
        <div class="formula-art" aria-label="0526 小考公式視覺">
          <div class="formula-stack">
            <div class="formula-line"><span>U</span><span>∝ x²</span></div>
            <div class="formula-line"><span>E</span><span>K + U</span></div>
            <div class="formula-line"><span>W<sub>nc</sub></span><span>ΔE</span></div>
          </div>
        </div>
      `;
    }

    function collisionArt() {
      return `
        <div class="collision-art" aria-label="0604 小考碰撞視覺">
          <div class="collision-board">
            <span class="ball left">甲</span>
            <span class="arrow left"></span>
            <span class="arrow right"></span>
            <span class="ball right">乙</span>
            <span class="momentum-label">Σp 前 = Σp 後</span>
          </div>
        </div>
      `;
    }

    buttons.forEach(button => {
      button.addEventListener("click", () => {
        buttons.forEach(item => item.classList.remove("active"));
        button.classList.add("active");
        render(button.dataset.filter);
      });
    });

    render();
  </script>
</body>
</html>
