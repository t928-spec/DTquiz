<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>0618 物理小考訂正互動詳解</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f8f6f1;
      --surface: #ffffff;
      --ink: #17212f;
      --muted: #647084;
      --line: #d8ddd7;
      --teal: #14736d;
      --teal-soft: #dff0ec;
      --red: #b94f43;
      --red-soft: #fae3dd;
      --gold: #9e751c;
      --gold-soft: #f7ebce;
      --blue: #315f8b;
      --blue-soft: #dfeaf4;
      --green: #42725a;
      --shadow: 0 14px 32px rgba(23, 33, 47, .09);
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(180deg, rgba(223, 240, 236, .78), transparent 350px),
        linear-gradient(90deg, rgba(247, 235, 206, .42), transparent 48%),
        var(--paper);
      color: var(--ink);
      font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.65;
    }

    button,
    input,
    textarea { font: inherit; }

    button { cursor: pointer; }

    img {
      max-width: 100%;
      display: block;
    }

    .app-shell {
      display: grid;
      grid-template-columns: minmax(210px, 262px) minmax(0, 1fr);
      gap: 24px;
      width: min(1280px, calc(100% - 32px));
      margin: 0 auto;
      padding: 24px 0 56px;
    }

    .sidebar {
      position: sticky;
      top: 16px;
      align-self: start;
      display: grid;
      gap: 12px;
      padding: 14px;
      background: rgba(255, 255, 255, .82);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
    }

    .brand {
      display: grid;
      gap: 4px;
      padding: 4px 4px 10px;
      border-bottom: 1px solid var(--line);
    }

    .brand strong {
      font-size: 1.06rem;
      line-height: 1.25;
    }

    .brand span,
    .muted {
      color: var(--muted);
      font-size: .9rem;
    }

    .home-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 36px;
      padding: 7px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      text-decoration: none;
      font-weight: 800;
      font-size: .92rem;
    }

    .home-link:hover,
    .home-link:focus-visible {
      border-color: var(--teal);
      background: var(--teal-soft);
      outline: none;
    }

    .question-nav {
      display: grid;
      gap: 6px;
    }

    .nav-link {
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      width: 100%;
      min-height: 42px;
      padding: 8px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--ink);
      text-align: left;
    }

    .nav-link:hover,
    .nav-link:focus-visible {
      background: var(--teal-soft);
      outline: none;
    }

    .nav-link.active {
      background: var(--teal);
      color: #fff;
    }

    .nav-index {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--ink);
      color: #fff;
      font-weight: 800;
      font-size: .82rem;
    }

    .nav-link.active .nav-index {
      background: #fff;
      color: var(--teal);
    }

    .nav-title {
      overflow-wrap: anywhere;
      line-height: 1.35;
      font-size: .94rem;
    }

    .nav-meta {
      justify-self: end;
      color: var(--muted);
      font-size: .78rem;
    }

    .nav-link.active .nav-meta {
      color: rgba(255, 255, 255, .84);
    }

    .sync-pill,
    .source-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      width: fit-content;
      padding: 5px 8px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      font-size: .8rem;
      background: #fff;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--gold);
    }

    .dot.online { background: var(--teal); }

    main {
      display: grid;
      gap: 18px;
      min-width: 0;
    }

    .topbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(250px, 360px);
      align-items: end;
      gap: 18px;
      min-height: 164px;
      padding: 8px 0 6px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 4.2rem);
      line-height: 1.05;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 1.02rem;
      max-width: 70ch;
    }

    .hero-card {
      display: grid;
      gap: 12px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .collision-visual {
      position: relative;
      min-height: 128px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background:
        linear-gradient(0deg, transparent 63%, rgba(23, 33, 47, .18) 64%, transparent 65%),
        var(--blue-soft);
    }

    .collision-ball {
      position: absolute;
      top: 50%;
      display: grid;
      place-items: center;
      width: 54px;
      height: 54px;
      border: 3px solid var(--ink);
      border-radius: 50%;
      background: #fff;
      font-weight: 900;
      transform: translateY(-50%);
    }

    .collision-ball.left { left: 34px; }
    .collision-ball.right { right: 34px; }

    .collision-arrow {
      position: absolute;
      top: calc(50% - 5px);
      width: 78px;
      height: 10px;
      background: var(--teal);
    }

    .collision-arrow::after {
      content: "";
      position: absolute;
      top: -8px;
      border-top: 13px solid transparent;
      border-bottom: 13px solid transparent;
    }

    .collision-arrow.left {
      left: 98px;
    }

    .collision-arrow.left::after {
      right: -1px;
      border-left: 20px solid var(--teal);
    }

    .collision-arrow.right {
      right: 98px;
      background: var(--red);
    }

    .collision-arrow.right::after {
      left: -1px;
      border-right: 20px solid var(--red);
    }

    .hero-equation {
      margin: 0;
      color: var(--ink);
      font-family: Cambria, "Times New Roman", "Noto Serif TC", serif;
      font-size: clamp(1.35rem, 3vw, 2rem);
      font-weight: 800;
      line-height: 1.2;
    }

    .hero-note {
      margin: 0;
      color: var(--muted);
      font-size: .92rem;
    }

    .gas-visual {
      position: relative;
      min-height: 128px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--blue-soft);
    }

    .gas-particle {
      position: absolute;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--teal);
      box-shadow: 0 0 0 4px rgba(20, 115, 109, .12);
    }

    .gas-particle:nth-child(1) { left: 12%; top: 22%; }
    .gas-particle:nth-child(2) { left: 28%; top: 67%; background: var(--red); }
    .gas-particle:nth-child(3) { left: 45%; top: 35%; }
    .gas-particle:nth-child(4) { left: 63%; top: 70%; background: var(--gold); }
    .gas-particle:nth-child(5) { left: 80%; top: 24%; background: var(--red); }
    .gas-particle:nth-child(6) { left: 88%; top: 65%; }

    .gas-equation {
      position: absolute;
      inset: 50% auto auto 50%;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, .9);
      color: var(--ink);
      font-family: Cambria, "Times New Roman", "Noto Serif TC", serif;
      font-size: 1.15rem;
      font-weight: 800;
      transform: translate(-50%, -50%);
      white-space: nowrap;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      padding: 8px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .tool-button,
    .detail-toggle,
    .comment-button,
    .ghost-button,
    .choice-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 36px;
      padding: 7px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
    }

    .tool-button:hover,
    .detail-toggle:hover,
    .comment-button:hover,
    .ghost-button:hover,
    .choice-button:hover {
      border-color: var(--teal);
      background: var(--teal-soft);
    }

    .tool-button[aria-pressed="true"],
    .choice-button.selected {
      border-color: var(--teal);
      background: var(--teal);
      color: #fff;
    }

    .quiz-card {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(250px, 330px);
      gap: 18px;
      padding: 18px;
      background: rgba(255, 255, 255, .9);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .quiz-card.is-hidden { display: none; }

    .question-main { min-width: 0; }

    .question-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .q-badge,
    .step-number {
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--ink);
      color: #fff;
      font-weight: 800;
    }

    h2 {
      margin: 0;
      font-size: clamp(1.28rem, 2.3vw, 1.7rem);
      line-height: 1.25;
      letter-spacing: 0;
    }

    h3 {
      margin: 0 0 8px;
      font-size: 1rem;
      line-height: 1.35;
      letter-spacing: 0;
    }

    .question-text {
      margin: 10px 0 12px;
      font-size: 1.04rem;
      white-space: pre-line;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 0 0 12px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 4px 8px;
      border-radius: 999px;
      background: var(--blue-soft);
      color: #244866;
      font-size: .86rem;
    }

    .answer-strip,
    .correction-strip {
      display: grid;
      gap: 3px;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid rgba(20, 115, 109, .26);
      background: var(--teal-soft);
    }

    .answer-strip span,
    .correction-strip span {
      color: var(--muted);
      font-size: .84rem;
    }

    .answer-strip strong,
    .correction-strip strong {
      font-size: 1.15rem;
      line-height: 1.35;
    }

    .formula {
      font-family: Cambria, "Times New Roman", "Noto Serif TC", serif;
      font-size: 1.08em;
      white-space: nowrap;
    }

    .frac {
      display: inline-grid;
      grid-template-rows: auto auto;
      place-items: center;
      vertical-align: middle;
      line-height: 1.05;
      margin: 0 .08em;
    }

    .frac > span:first-child {
      border-bottom: 1px solid currentColor;
      min-width: 100%;
      padding: 0 .12em .03em;
    }

    .frac > span:last-child {
      padding: .03em .12em 0;
    }

    .steps {
      display: grid;
      gap: 10px;
      margin-top: 14px;
    }

    .step {
      display: grid;
      gap: 8px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .step-top {
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr);
      gap: 10px;
      align-items: start;
    }

    .step-title {
      margin: 0;
      font-weight: 800;
    }

    .step-body {
      margin: 2px 0 0;
      color: #293443;
    }

    .detail {
      display: none;
      padding: 10px;
      border-radius: 8px;
      background: var(--gold-soft);
      color: #403019;
    }

    .step.open .detail { display: block; }

    .step-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding-left: 44px;
    }

    .side-panel {
      display: grid;
      align-content: start;
      gap: 12px;
      min-width: 0;
    }

    .diagram,
    .mini-panel,
    .check-panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .diagram {
      overflow: hidden;
      padding: 12px;
    }

    .diagram img {
      width: 100%;
      max-height: 220px;
      object-fit: contain;
    }

    .diagram .placeholder {
      display: grid;
      min-height: 118px;
      place-items: center;
      padding: 16px;
      border-radius: 8px;
      background:
        linear-gradient(90deg, transparent 49%, rgba(49, 95, 139, .18) 50%, transparent 51%),
        repeating-linear-gradient(0deg, rgba(20, 115, 109, .08), rgba(20, 115, 109, .08) 1px, transparent 1px, transparent 18px),
        var(--blue-soft);
      text-align: center;
      font-weight: 800;
      color: #244866;
    }

    .mini-panel,
    .check-panel {
      padding: 12px;
    }

    .mini-panel ul {
      margin: 0;
      padding-left: 1.15rem;
    }

    .mini-panel li + li { margin-top: 5px; }

    .warning-panel.hidden { display: none; }

    .concept-note {
      display: grid;
      gap: 6px;
      padding: 10px;
      border-radius: 8px;
      background: var(--red-soft);
      color: #4a1f1a;
    }

    .check-options {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 8px;
    }

    .check-feedback {
      min-height: 28px;
      margin: 8px 0 0;
      color: var(--muted);
      font-size: .92rem;
    }

    .check-feedback.correct { color: var(--green); }
    .check-feedback.wrong { color: var(--red); }

    .comments {
      grid-column: 1 / -1;
      display: grid;
      gap: 10px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
    }

    .comment-list {
      display: grid;
      gap: 8px;
    }

    .comment {
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .comment-meta {
      color: var(--muted);
      font-size: .82rem;
    }

    .comment-text { margin: 4px 0 0; }

    .comment-form {
      display: grid;
      grid-template-columns: 150px minmax(0, 1fr) auto;
      gap: 8px;
      align-items: start;
    }

    .comment-form input,
    .comment-form textarea {
      width: 100%;
      min-height: 38px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
    }

    .comment-form textarea {
      min-height: 38px;
      resize: vertical;
    }

    .empty {
      margin: 0;
      color: var(--muted);
    }

    @media (max-width: 940px) {
      .app-shell {
        grid-template-columns: 1fr;
        width: min(100% - 24px, 760px);
        padding-top: 12px;
      }

      .sidebar {
        position: static;
      }

      .question-nav {
        grid-template-columns: repeat(5, minmax(0, 1fr));
      }

      .nav-link {
        grid-template-columns: 1fr;
        justify-items: center;
        min-height: 58px;
      }

      .nav-title {
        text-align: center;
        font-size: .8rem;
      }

      .nav-meta { display: none; }

      .topbar {
        grid-template-columns: 1fr;
        min-height: 0;
      }

      .quiz-card {
        grid-template-columns: 1fr;
      }

      .comment-form {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 560px) {
      .question-nav {
        grid-template-columns: repeat(5, 1fr);
      }

      .toolbar {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }

      .tool-button { width: 100%; }

      .quiz-card {
        padding: 12px;
      }

      .question-text {
        font-size: 1rem;
      }

      .step-actions {
        padding-left: 0;
      }

    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="題目導覽">
      <div class="brand">
        <strong>0618 物理小考訂正</strong>
        <span>力學二與熱學｜範圍 5-1～5-3</span>
      </div>
      <a class="home-link" href="index.html">← 返回首頁</a>
      <nav id="questionNav" class="question-nav"></nav>
      <div id="syncStatus" class="sync-pill"><span class="dot"></span><span>本機留言</span></div>
      <span class="source-pill">理想氣體｜氣體動力論</span>
    </aside>

    <main>
      <header class="topbar">
        <div>
          <h1>分步詳解</h1>
          <p class="subtitle">每一步都可展開；先分清楚巨觀量與微觀量，再處理速率分布、平均動能與絕熱容器中的能量守恆。</p>
        </div>
        <aside class="hero-card" aria-label="理想氣體微觀模型簡圖">
          <div class="gas-visual">
            <span class="gas-particle"></span>
            <span class="gas-particle"></span>
            <span class="gas-particle"></span>
            <span class="gas-particle"></span>
            <span class="gas-particle"></span>
            <span class="gas-particle"></span>
            <span class="gas-equation">PV = NkT</span>
          </div>
          <p class="hero-equation">P = <span class="frac"><span>1</span><span>3</span></span>ρ<span style="text-decoration: overline;">v²</span></p>
          <p class="hero-note">溫度決定平均平移動能，不代表每個分子的速率相同。</p>
        </aside>
      </header>

      <div class="toolbar" aria-label="詳解控制">
        <button class="tool-button" id="showAllQuestions" type="button" aria-pressed="false">▦ 顯示全部</button>
        <button class="tool-button" id="expandAll" type="button">＋ 全部展開</button>
        <button class="tool-button" id="collapseAll" type="button">－ 全部收合</button>
        <button class="tool-button" id="toggleWarnings" type="button" aria-pressed="true">！易錯提醒</button>
      </div>

      <section id="quizList" aria-label="題目與詳解"></section>
    </main>
  </div>

  <template id="commentTemplate">
    <article class="comment">
      <div class="comment-meta"></div>
      <p class="comment-text"></p>
    </article>
  </template>

    const storageKey = "datong-0618-comments-v1";
    let comments = [];
    let activeQuestionId = "0618-q1";
    let showAllQuestions = false;

    const nav = document.querySelector("#questionNav");
    const quizList = document.querySelector("#quizList");
    const syncStatus = document.querySelector("#syncStatus");

    function render() {
      nav.innerHTML = quiz.map((item, index) => `
        <button class="nav-link" type="button" data-question-id="${item.id}" aria-pressed="${item.id === activeQuestionId}">
          <span class="nav-index">${index + 1}</span>
          <span class="nav-title">${escapeHtml(item.nav)}</span>
          <span class="nav-meta" data-comment-count="${item.id}"></span>
        </button>
      `).join("");

      quizList.innerHTML = quiz.map((item, index) => questionCard(item, index)).join("");
      bindStepControls();
      bindForms();
      bindQuestionNav();
      bindChecks();
      setQuestionView(activeQuestionId, false);
      renderAllComments();
    }

    function questionCard(item, index) {
      return `
        <article class="quiz-card" id="${item.id}">
          <div class="question-main">
            <header class="question-header">
              <span class="q-badge">${index + 1}</span>
              <h2>${escapeHtml(item.title)}</h2>
            </header>
            <p class="question-text">${escapeHtml(item.question)}</p>
            <div class="chips" aria-label="使用概念">
              ${item.concepts.map(concept => `<span class="chip">${escapeHtml(concept)}</span>`).join("")}
            </div>
            <div class="answer-strip">
              <span>答案整理</span>
              <strong>${item.answer}</strong>
            </div>
            <div class="steps">
              ${item.steps.map((step, stepIndex) => stepCard(item.id, step, stepIndex)).join("")}
            </div>
          </div>
          <aside class="side-panel">
            <div class="diagram">${diagrams[item.diagram]}</div>
            <section class="check-panel" data-check="${item.id}">
              <h3>小檢核</h3>
              <p class="empty">${escapeHtml(item.check.prompt)}</p>
              <div class="check-options">
                ${item.check.options.map((option, optionIndex) => `
                  <button class="choice-button" type="button" data-question-id="${item.id}" data-option="${optionIndex}">
                    ${escapeHtml(option)}
                  </button>
                `).join("")}
              </div>
              <p class="check-feedback" data-feedback="${item.id}"></p>
            </section>
            <section class="mini-panel warning-panel">
              <h3>容易寫錯</h3>
              <ul>
                ${item.pitfalls.map(pitfall => `<li>${escapeHtml(pitfall)}</li>`).join("")}
              </ul>
            </section>
          </aside>
          <section class="comments" data-question-id="${item.id}">
            <h3>同學提問</h3>
            <div class="comment-list" data-comment-list="${item.id}"></div>
            <form class="comment-form" data-form="${item.id}">
              <input name="name" maxlength="18" placeholder="姓名或座號" autocomplete="name">
              <textarea name="message" maxlength="500" placeholder="哪一步卡住？也可以寫自己的訂正句。"></textarea>
              <button class="comment-button" type="submit">送出</button>
            </form>
          </section>
        </article>
      `;
    }

    function stepCard(questionId, step, stepIndex) {
      const stepId = `${questionId}-s${stepIndex + 1}`;
      return `
        <section class="step" data-step-id="${stepId}">
          <div class="step-top">
            <span class="step-number">${stepIndex + 1}</span>
            <div>
              <p class="step-title">${escapeHtml(step.title)}</p>
              <p class="step-body">${step.body}</p>
            </div>
          </div>
          <div class="detail">${step.detail}</div>
          <div class="step-actions">
            <button class="detail-toggle" type="button" aria-expanded="false">詳解</button>
            <button class="ghost-button ask-step" type="button" data-question-id="${questionId}" data-step-label="第 ${stepIndex + 1} 步：${escapeHtml(step.title)}">我卡在這步</button>
          </div>
        </section>
      `;
    }

    function bindStepControls() {
      document.querySelectorAll(".detail-toggle").forEach(button => {
        button.addEventListener("click", () => {
          const step = button.closest(".step");
          const isOpen = step.classList.toggle("open");
          button.setAttribute("aria-expanded", String(isOpen));
          button.textContent = isOpen ? "收合" : "詳解";
        });
      });

      document.querySelectorAll(".ask-step").forEach(button => {
        button.addEventListener("click", () => {
          const form = document.querySelector(`[data-form="${button.dataset.questionId}"]`);
          const textarea = form.querySelector("textarea");
          textarea.value = `${button.dataset.stepLabel}：`;
          textarea.focus();
        });
      });
    }

    function bindChecks() {
      document.querySelectorAll(".choice-button").forEach(button => {
        button.addEventListener("click", () => {
          const question = quiz.find(item => item.id === button.dataset.questionId);
          const optionIndex = Number(button.dataset.option);
          const feedback = document.querySelector(`[data-feedback="${question.id}"]`);
          document.querySelectorAll(`[data-question-id="${question.id}"].choice-button`).forEach(choice => {
            choice.classList.toggle("selected", choice === button);
          });
          const isCorrect = optionIndex === question.check.answer;
          feedback.textContent = isCorrect ? `答對。${question.check.feedback}` : `再想一下。${question.check.feedback}`;
          feedback.classList.toggle("correct", isCorrect);
          feedback.classList.toggle("wrong", !isCorrect);
        });
      });
    }

    function bindForms() {
      document.querySelectorAll(".comment-form").forEach(form => {
        form.addEventListener("submit", async event => {
          event.preventDefault();
          const questionId = form.dataset.form;
          const formData = new FormData(form);
          const payload = {
            question_id: questionId,
            step_id: "",
            name: String(formData.get("name") || "同學").trim().slice(0, 18) || "同學",
            message: String(formData.get("message") || "").trim().slice(0, 500),
            created_at: new Date().toISOString()
          };
          if (!payload.message) return;
          await addComment(payload);
          form.reset();
          renderComments(questionId);
        });
      });
    }

    function bindQuestionNav() {
      document.querySelectorAll(".nav-link").forEach(button => {
        button.addEventListener("click", () => {
          showAllQuestions = false;
          setQuestionView(button.dataset.questionId, true);
        });
      });
    }

    function setQuestionView(questionId, shouldScroll) {
      activeQuestionId = questionId;
      document.querySelector("#showAllQuestions").setAttribute("aria-pressed", String(showAllQuestions));
      document.querySelectorAll(".quiz-card").forEach(card => {
        card.classList.toggle("is-hidden", !showAllQuestions && card.id !== activeQuestionId);
      });
      document.querySelectorAll(".nav-link").forEach(button => {
        const isActive = !showAllQuestions && button.dataset.questionId === activeQuestionId;
        button.classList.toggle("active", isActive);
        button.setAttribute("aria-pressed", String(isActive));
      });
      if (shouldScroll) {
        document.querySelector("#quizList").scrollIntoView({ behavior: "smooth", block: "start" });
      }
    }

    async function loadComments() {
      if (hasSupabase) {
        try {
          const response = await fetch(`${COMMENT_BACKEND.supabaseUrl}/rest/v1/${COMMENT_BACKEND.table}?select=*&order=created_at.asc`, {
            headers: {
              apikey: COMMENT_BACKEND.supabaseAnonKey,
              Authorization: `Bearer ${COMMENT_BACKEND.supabaseAnonKey}`
            }
          });
          if (!response.ok) throw new Error("comment fetch failed");
          comments = await response.json();
          updateSync(true);
          return;
        } catch (error) {
          console.warn(error);
        }
      }

      comments = JSON.parse(localStorage.getItem(storageKey) || "[]");
      updateSync(false);
    }

    async function addComment(payload) {
      if (hasSupabase) {
        try {
          const response = await fetch(`${COMMENT_BACKEND.supabaseUrl}/rest/v1/${COMMENT_BACKEND.table}`, {
            method: "POST",
            headers: {
              apikey: COMMENT_BACKEND.supabaseAnonKey,
              Authorization: `Bearer ${COMMENT_BACKEND.supabaseAnonKey}`,
              "Content-Type": "application/json",
              Prefer: "return=representation"
            },
            body: JSON.stringify(payload)
          });
          if (!response.ok) throw new Error("comment insert failed");
          const inserted = await response.json();
          comments.push(inserted[0] || payload);
          return;
        } catch (error) {
          console.warn(error);
        }
      }

      comments.push({ ...payload, id: crypto.randomUUID() });
      localStorage.setItem(storageKey, JSON.stringify(comments));
    }

    function renderAllComments() {
      quiz.forEach(item => renderComments(item.id));
      updateCommentCounts();
    }

    function renderComments(questionId) {
      const list = document.querySelector(`[data-comment-list="${questionId}"]`);
      const filtered = comments.filter(comment => comment.question_id === questionId);
      if (!filtered.length) {
        list.innerHTML = `<p class="empty">目前還沒有提問。</p>`;
        return;
      }

      list.innerHTML = "";
      const template = document.querySelector("#commentTemplate");
      filtered.forEach(comment => {
        const node = template.content.cloneNode(true);
        node.querySelector(".comment-meta").textContent = `${comment.name || "同學"} · ${formatDate(comment.created_at)}`;
        node.querySelector(".comment-text").textContent = comment.message;
        list.appendChild(node);
      });
      updateCommentCounts();
    }

    function updateCommentCounts() {
      quiz.forEach(item => {
        const count = comments.filter(comment => comment.question_id === item.id).length;
        const label = document.querySelector(`[data-comment-count="${item.id}"]`);
        if (label) label.textContent = count ? `${count} 則` : "";
      });
    }

    function updateSync(online) {
      const dot = syncStatus.querySelector(".dot");
      dot.classList.toggle("online", online);
      syncStatus.querySelector("span:last-child").textContent = online ? "共享留言" : "本機留言";
    }

    function formatDate(value) {
      try {
        return new Intl.DateTimeFormat("zh-TW", {
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit"
        }).format(new Date(value));
      } catch {
        return "";
      }
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    document.querySelector("#expandAll").addEventListener("click", () => {
      document.querySelectorAll(".step").forEach(step => step.classList.add("open"));
      document.querySelectorAll(".detail-toggle").forEach(button => {
        button.setAttribute("aria-expanded", "true");
        button.textContent = "收合";
      });
    });

    document.querySelector("#collapseAll").addEventListener("click", () => {
      document.querySelectorAll(".step").forEach(step => step.classList.remove("open"));
      document.querySelectorAll(".detail-toggle").forEach(button => {
        button.setAttribute("aria-expanded", "false");
        button.textContent = "詳解";
      });
    });

    document.querySelector("#toggleWarnings").addEventListener("click", event => {
      const pressed = event.currentTarget.getAttribute("aria-pressed") === "true";
      event.currentTarget.setAttribute("aria-pressed", String(!pressed));
      document.querySelectorAll(".warning-panel").forEach(panel => panel.classList.toggle("hidden", pressed));
    });

    document.querySelector("#showAllQuestions").addEventListener("click", event => {
      showAllQuestions = event.currentTarget.getAttribute("aria-pressed") !== "true";
      setQuestionView(activeQuestionId, false);
    });

    render();
    loadComments().then(renderAllComments);
  </script>
</body>
</html>
